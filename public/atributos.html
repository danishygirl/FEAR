<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atributos / Arquétipos — OC 101</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="attributes-page overview-attributes-page" id="attributes-page">
    <section class="attributes-overview-shell">
      <div class="system-page-topline">
        <span class="system-page-kicker">Sistema Central</span>
        <span class="system-page-rule"></span>
      </div>
      <section class="overview-section">
        <div class="overview-section-head">
          <div>
            <h1>Atributos</h1>
            <p>Leitura rápida das aptidões centrais do personagem e de seus níveis de impacto narrativo.</p>
          </div>
        </div>
        <div class="overview-grid attributes-overview-grid" id="attribute-grid"></div>
      </section>

      <div class="overview-divider"></div>

      <section class="overview-section">
        <div class="overview-section-head">
          <div>
            <h2>Arquétipos</h2>
            <p>Perfis narrativos que ajudam a definir presença, comportamento e papel dramático no grupo.</p>
          </div>
        </div>
        <div class="overview-grid archetypes-overview-grid" id="archetype-list"></div>
      </section>
    </section>
  </main>
  <script src="site-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
