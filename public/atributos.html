<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atributos / Arquétipos — OC 101</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="attributes-page attributes-page-standalone" id="attributes-page">
    <section class="attributes-shell">
      <div class="attributes-section">
        <div class="attributes-left">
          <div class="section-header compact">
            <h1>Atributos</h1>
          </div>
          <div class="attribute-grid" id="attribute-grid"></div>
        </div>
        <div class="attributes-right" id="attribute-detail"></div>
      </div>

      <div class="attributes-divider"></div>

      <div class="archetypes-section">
        <div class="archetypes-left">
          <div class="section-header compact">
            <h2>Arquétipos</h2>
          </div>
          <div class="archetype-list" id="archetype-list"></div>
        </div>
        <div class="archetypes-right" id="archetype-detail"></div>
      </div>
    </section>
  </main>
  <script src="site-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
